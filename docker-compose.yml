#version: "3.9"

# - Reusable base --------------------------------------------------------------
x-db-service: &db-base
  image: ${DB_IMAGE}
  shm_size: ${DB_SHM_SIZE}
  environment:
    - TZ=${TZ}
    - ORACLE_PWD=${ORACLE_PWD}
    - ORACLE_SID=${ORACLE_SID}
    - ORACLE_PDB=${ORACLE_PDB}
  ports:
    - "${LISTENER_PORT}:1521"
    - "${OEM_EXPRESS_PORT}:5500"
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  deploy:
    resources:
      limits:
        memory: ${DB_MEM}
  restart: unless-stopped

services:

  # - Plain Oracle AI Database 26ai Free ---------------------------------------
  # Baseline container; mounts only common assets.
  cdbfree:
    <<: *db-base
    container_name: cdbfree
    profiles: ["cdbfree"]
    volumes:
      - ${ORADATA_HOST}:/opt/oracle/oradata
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/scripts:ro
    ports:
      - "${CDBFREE_LISTENER_PORT}:1521"
      - "${CDBFREE_OEM_EXPRESS_PORT}:5500"

  # - Empty DB for lab/engineering/tests ---------------------------------------
  # Clean DB + optional lab-specific init.
  labdb:
    <<: *db-base
    container_name: labdb
    hostname: labdb
    profiles: ["labdb"]
    volumes:
      - ./data/labdb:/opt/oracle/oradata
      - ./data/labdb/dbconfig:/opt/oracle/dbconfig
      - ./data/labdb/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/labdb/setup:/opt/oracle/scripts/setup:ro
      - ./config/labdb/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${LABDB_LISTENER_PORT}:1521"
      - "${LABDB_OEM_EXPRESS_PORT}:5500"

  # - OraDBA repository via SQL scripts ----------------------------------------
  odbrepo:
    <<: *db-base
    container_name: odbrepo
    hostname: odbrepo
    profiles: ["odbrepo"]
    volumes:
      - ./data/odbrepo:/opt/oracle/oradata
      - ./data/odbrepo/dbconfig:/opt/oracle/dbconfig
      - ./data/odbrepo/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/odbrepo/setup:/opt/oracle/scripts/setup:ro
      - ./config/odbrepo/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${ODBREPO_LISTENER_PORT}:1521"
      - "${ODBREPO_OEM_EXPRESS_PORT}:5500"

  # - OraDBA repository from PDB archive (seed) --------------------------------
  odbseed:
    <<: *db-base
    container_name: odbseed
    hostname: odbseed
    profiles: ["odbseed"]
    volumes:
      - ./data/odbseed:/opt/oracle/oradata
      - ./data/odbseed/dbconfig:/opt/oracle/dbconfig
      - ./data/odbseed/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/odbseed/setup:/opt/oracle/scripts/setup:ro
      - ./config/odbseed/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${ODBSEED_LISTENER_PORT}:1521"
      - "${ODBSEED_OEM_EXPRESS_PORT}:5500"

  # - Complex OraDBA demo from PDB archive -------------------------------------
  odbdemo:
    <<: *db-base
    container_name: odbdemo
    hostname: odbdemo
    profiles: ["odbdemo"]
    volumes:
      - ./data/odbdemo:/opt/oracle/oradata
      - ./data/odbdemo/dbconfig:/opt/oracle/dbconfig
      - ./data/odbdemo/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/odbdemo/setup:/opt/oracle/scripts/setup:ro
      - ./config/odbdemo/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${ODBEMO_LISTENER_PORT}:1521"
      - "${ODBEMO_OEM_EXPRESS_PORT}:5500"
# - EOF ------------------------------------------------------------------------
