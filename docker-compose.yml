# Purpose....: Docker Compose file for Oracle Free 23ai EA Lab services
# Notes......: Defines profiles for the following services:
#              - cdbfree : plain Oracle 23ai Free Edition
#              - labdb   : empty database for labs/tests
#              - earepo  : EA repository created via SQL scripts
#              - easeed  : EA repository created from PDB archive
#              - eademo  : complex EA demo repository from PDB archive
#
# Reference..: https://github.com/oehrlis/oracle-free23-ealab
