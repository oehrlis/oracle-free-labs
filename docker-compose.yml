# Purpose....: Docker Compose file for Oracle Free 23ai OraDBA Lab services
# Notes......: Defines profiles for the following services:
#              - cdbfree  : plain Oracle 23ai Free Edition
#              - labdb    : empty database for labs/tests
#              - odbrepo  : OraDBA demo created via SQL scripts
#              - odbseed  : OraDBA demo created from PDB archive
#              - odbdemo  : complex OraDBA demo from PDB archive
#              - odbenc   : complex OraDBA demo with TDE via SQL scripts
#
# Reference..: https://github.com/oehrlis/oracle-free-labs
