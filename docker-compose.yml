#version: "3.9"

# - Reusable base --------------------------------------------------------------
x-db-service: &db-base
  image: ${DB_IMAGE}
  shm_size: ${DB_SHM_SIZE}
  environment:
    - TZ=${TZ}
    - ORACLE_PWD=${ORACLE_PWD}
    - ORACLE_SID=${ORACLE_SID}
    - ORACLE_PDB=${ORACLE_PDB}
  ports:
    - "${LISTENER_PORT}:1521"
    - "${OEM_EXPRESS_PORT}:5500"
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  deploy:
    resources:
      limits:
        memory: ${DB_MEM}
  restart: unless-stopped

services:

  # - Plain Oracle AI Database 26ai Free ---------------------------------------
  # Baseline container; mounts only common assets.
  cdbfree:
    <<: *db-base
    container_name: cdbfree
    profiles: ["cdbfree"]
    volumes:
      - ${ORADATA_HOST}:/opt/oracle/oradata
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/scripts:ro
    ports:
      - "${CDBFREE_LISTENER_PORT}:1521"
      - "${CDBFREE_OEM_EXPRESS_PORT}:5500"

  # - Empty DB for lab/engineering/tests ---------------------------------------
  # Clean DB + optional lab-specific init.
  labdb:
    <<: *db-base
    container_name: labdb
    hostname: labdb
    profiles: ["labdb"]
    volumes:
      - ./data/labdb:/opt/oracle/oradata
      - ./data/labdb/dbconfig:/opt/oracle/dbconfig
      - ./data/labdb/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/labdb/setup:/opt/oracle/scripts/setup:ro
      - ./config/labdb/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${LABDB_LISTENER_PORT}:1521"
      - "${LABDB_OEM_EXPRESS_PORT}:5500"

  # - TVD repository via SQL scripts -------------------------------------------
  tvdrepo:
    <<: *db-base
    container_name: tvdrepo
    hostname: tvdrepo
    profiles: ["tvdrepo"]
    volumes:
      - ./data/tvdrepo:/opt/oracle/oradata
      - ./data/tvdrepo/dbconfig:/opt/oracle/dbconfig
      - ./data/tvdrepo/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/tvdrepo/setup:/opt/oracle/scripts/setup:ro
      - ./config/tvdrepo/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${TVDREPO_LISTENER_PORT}:1521"
      - "${TVDREPO_OEM_EXPRESS_PORT}:5500"

  # - TVD repository from PDB archive (seed) -----------------------------------
  tvdseed:
    <<: *db-base
    container_name: tvdseed
    hostname: tvdseed
    profiles: ["tvdseed"]
    volumes:
      - ./data/tvdseed:/opt/oracle/oradata
      - ./data/tvdseed/dbconfig:/opt/oracle/dbconfig
      - ./data/tvdseed/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/tvdseed/setup:/opt/oracle/scripts/setup:ro
      - ./config/tvdseed/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${TVDSEED_LISTENER_PORT}:1521"
      - "${TVDSEED_OEM_EXPRESS_PORT}:5500"

  # - Complex TVD demo from PDB archive ----------------------------------------
  tvddemo:
    <<: *db-base
    container_name: tvddemo
    hostname: tvddemo
    profiles: ["tvddemo"]
    volumes:
      - ./data/tvddemo:/opt/oracle/oradata
      - ./data/tvddemo/dbconfig:/opt/oracle/dbconfig
      - ./data/tvddemo/logs:/opt/oracle/scripts/logs   # <-- writable logs
      - ${COMMON_DATA_HOST}:/opt/oracle/data
      - ./config/common/scripts:/opt/oracle/common/scripts:ro
      - ./config/tvddemo/setup:/opt/oracle/scripts/setup:ro
      - ./config/tvddemo/startup:/opt/oracle/scripts/startup:ro
    ports:
      - "${TVDEMO_LISTENER_PORT}:1521"
      - "${TVDEMO_OEM_EXPRESS_PORT}:5500"
# - EOF ------------------------------------------------------------------------
